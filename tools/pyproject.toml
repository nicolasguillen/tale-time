[project]
name = "storytool"
version = "0.1.0"
description = "The Tale Time content pipeline: the `story` CLI."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pillow>=13.0.0",
]

[project.scripts]
story = "storytool.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storytool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
